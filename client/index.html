<html lang="en">

      name="viewport"

    <!-- Primary SEO -->
    <title>J Vick | Official Artist Website</title>

    <meta name="robots" content="index, follow" />

      href="https://j-vicks-music.vercel.app/"

    <meta
      property="og:url"
      content="https://j-vicks-music.vercel.app/"

      property="og:title"

      property="og:image:type"
      content="image/png"
    />

    <meta
      property="og:image:height"
